<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="ahcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044e42"/>
      <stop offset="50%" stop-color="#0d735a"/>
      <stop offset="100%" stop-color="#148358"/>
    </linearGradient>

    <!-- Warm gold & amber accent -->
    <linearGradient id="ahcGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Leaf fresh gradient -->
    <linearGradient id="ahcLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="60%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>

    <!-- Inner glow filter -->
    <filter id="ahcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d735a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer rounded container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#ahcBgGrad)" filter="url(#ahcGlow)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Subtle inner radial glow circle -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#ahcGoldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.45"/>

  <!-- Central Medical & Ayurvedic Healing Cross + Leaves -->
  <g transform="translate(60, 60)">
    <!-- Soft pulsing halo -->
    <circle cx="0" cy="0" r="28" fill="rgba(255, 255, 255, 0.08)"/>

    <!-- Medical Cross (curved, soft edges) -->
    <path d="M-6,-22 C-6,-24 -4,-26 -2,-26 L2,-26 C4,-26 6,-24 6,-22 L6,-6 L22,-6 C24,-6 26,-4 26,-2 L26,2 C26,4 24,6 22,6 L6,6 L6,22 C6,24 4,26 2,26 L-2,26 C-4,26 -6,24 -6,22 L-6,6 L-22,6 C-24,6 -26,4 -26,2 L-26,-2 C-26,-4 -24,-6 -22,-6 L-6,-6 Z"
          fill="#ffffff"
          opacity="0.96"/>

    <!-- Left Ayurvedic Leaf curving upward -->
    <path d="M-2,6 C-14,8 -24,-2 -22,-16 C-20,-24 -10,-26 -2,-20 C-4,-14 -2,-6 -2,6 Z"
          fill="url(#ahcLeafGrad)"
          opacity="0.92"/>

    <!-- Right Ayurvedic Leaf curving downward / outward -->
    <path d="M2,-6 C14,-8 24,2 22,16 C20,24 10,26 2,20 C4,14 2,6 2,-6 Z"
          fill="url(#ahcGoldGrad)"
          opacity="0.94"/>

    <!-- Center golden dewdrop -->
    <circle cx="0" cy="0" r="4" fill="url(#ahcGoldGrad)"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>
</svg>
